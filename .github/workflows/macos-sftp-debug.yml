# Temporary: diagnose the intermittent macOS hang in ConnectionDroppedMidUpload_ClientFails_ServerStaysHealthy.
name: macOS sftp debug

on:
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run the tests
        default: "10"
      filter:
        description: dotnet test filter; empty runs the whole suite, as under CI load
        default: ""

jobs:
  debug:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      INTERTUBE_SSH_LOGLEVEL: DEBUG3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sftp -V 2>&1 || true
      - run: dotnet build Intertube.slnx
      - name: Capture FIN/RST on loopback
        run: |
          sudo tcpdump -i lo0 -nn -tttt -l 'tcp[tcpflags] & (tcp-rst|tcp-fin) != 0 and not port 22' > tcpdump.txt 2>&1 &
          sleep 2
      - name: Run the test repeatedly
        run: |
          failures=0
          for i in $(seq 1 ${{ inputs.runs }}); do
            echo "::group::run $i"
            date -u +%H:%M:%S.%N
            if ! dotnet test Intertube.slnx --no-build ${{ inputs.filter != '' && format('--filter "{0}"', inputs.filter) || '' }} --logger "console;verbosity=normal"; then
              failures=$((failures+1))
              echo "::warning::run $i failed"
            fi
            echo "::endgroup::"
          done
          echo "failures: $failures of ${{ inputs.runs }}"
      - name: Packet capture
        if: always()
        run: |
          sudo pkill tcpdump || true
          sleep 1
          cat tcpdump.txt
